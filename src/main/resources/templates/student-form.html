<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Student Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="navbar">
    <h1>Student Management System</h1>
</div>

<div class="container" style="max-width: 500px;">
    <h2 th:text="${title}">Add Student</h2>

    <form th:action="@{/students/save}" th:object="${student}" method="post">

        <!-- hidden id, empty when adding a new student -->
        <input type="hidden" th:field="*{id}">

        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" th:field="*{name}" placeholder="Enter name">
            <span class="error-text" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="text" id="email" th:field="*{email}" placeholder="Enter email">
            <span class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <div class="form-group">
            <label for="course">Course</label>
            <input type="text" id="course" th:field="*{course}" placeholder="e.g. Computer Science">
            <span class="error-text" th:if="${#fields.hasErrors('course')}" th:errors="*{course}"></span>
        </div>

        <div class="form-group">
            <label for="age">Age</label>
            <input type="number" id="age" th:field="*{age}" placeholder="Enter age">
            <span class="error-text" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></span>
        </div>

        <button type="submit" class="btn btn-success">Save</button>
        <a th:href="@{/students}" class="btn btn-grey">Cancel</a>
    </form>
</div>

</body>
</html>
