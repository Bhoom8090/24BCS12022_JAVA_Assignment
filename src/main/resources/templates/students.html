<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="navbar">
    <h1>Student Management System</h1>
</div>

<div class="container">
    <h2>All Students</h2>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="toolbar">
        <form th:action="@{/students}" method="get" class="search-form">
            <input type="text" name="course" th:value="${course}" placeholder="Search by course">
            <button type="submit" class="btn btn-primary">Search</button>
            <a th:href="@{/students}" class="btn btn-grey">Reset</a>
        </form>

        <a th:href="@{/students/new}" class="btn btn-success">+ Add New Student</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Course</th>
            <th>Age</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${students}">
            <td th:text="${s.id}"></td>
            <td th:text="${s.name}"></td>
            <td th:text="${s.email}"></td>
            <td th:text="${s.course}"></td>
            <td th:text="${s.age}"></td>
            <td class="actions">
                <a th:href="@{/students/edit/{id}(id=${s.id})}" class="btn btn-warning">Edit</a>
                <form th:action="@{/students/delete/{id}(id=${s.id})}" method="post"
                      onsubmit="return confirm('Are you sure you want to delete this student?');">
                    <button type="submit" class="btn btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(students)}">
            <td colspan="6" class="empty-msg">No students found.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
