# ---------- Server ----------
server.port=8080
spring.application.name=student-management-system

# ---------- MySQL Database ----------
# Database is created automatically if it does not exist.
# Username and password are read from environment variables DB_USERNAME / DB_PASSWORD.
# If they are not set, the defaults after the colon (root / root) are used.
# Either set the environment variables or change the defaults to your own MySQL login.
spring.datasource.url=jdbc:mysql://localhost:3306/student_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# update -> creates/updates the table automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false
